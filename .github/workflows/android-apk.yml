name: Build test apps (Android + Web)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform from Flutter template
        run: flutter create --platforms=android --project-name successful_life --org com.successfullife .
      - name: Remove default template test
        run: rm -rf test
      - name: Android configuration
        run: python3 scripts/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build small release APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Show APK sizes
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - name: Collect APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/successful-life-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: out/*.apk
          if-no-files-found: error

  # iOS native build is paused to save build minutes. To bring it back, remove the next line.
  ios:
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform from Flutter template
        run: flutter create --platforms=ios --project-name successful_life --org com.successfullife .
      - name: Remove default template test
        run: rm -rf test
      - name: iOS configuration
        run: python3 scripts/configure_ios.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          cd out && zip -qry successful-life-ios-unsigned.ipa Payload && rm -rf Payload
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/successful-life-ios-unsigned.ipa
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web platform from Flutter template
        run: flutter create --platforms=web --project-name successful_life --org com.successfullife .
      - name: Remove default template test
        run: rm -rf test
      - name: Web configuration
        run: python3 scripts/configure_web.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build web app (all files self-hosted, no third-party requests)
        run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dl
          gh release create "test-build-${{ github.run_number }}" dl/* --title "Test build ${{ github.run_number }}" --latest --notes "Android: use successful-life-arm64.apk on almost every phone (very old 32-bit phones are not supported). iPhone: use the web app (see the README)."
