name: Build Android test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform from Flutter template
        run: flutter create --platforms=android --project-name successful_life --org com.successfullife .
      - name: Remove default template test
        run: rm -rf test
      - name: Add Android permissions and disable cloud backup
        run: python3 scripts/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build test APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: successful-life-android-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk successful-life-test.apk
          gh release create "test-build-${{ github.run_number }}" successful-life-test.apk --title "Test build ${{ github.run_number }}" --notes "Debug APK for testing. Install on Android and allow installs from unknown sources." --prerelease
