name: Build test apps (Android + iOS)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform from Flutter template
        run: flutter create --platforms=android --project-name successful_life --org com.successfullife .
      - name: Remove default template test
        run: rm -rf test
      - name: Android configuration
        run: python3 scripts/configure_android.py
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build small release APKs (one per CPU type)
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - name: Show APK sizes
        run: ls -l build/app/outputs/flutter-apk/*.apk
      - name: Collect APKs
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/successful-life-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/successful-life-arm32-older-phones.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: out/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform from Flutter template
        run: flutter create --platforms=ios --project-name successful_life --org com.successfullife .
      - name: Remove default template test
        run: rm -rf test
      - name: iOS configuration
        run: python3 scripts/configure_ios.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p out/Payload
          cp -R build/ios/iphoneos/Runner.app out/Payload/
          cd out && zip -qry successful-life-ios-unsigned.ipa Payload && rm -rf Payload
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: out/successful-life-ios-unsigned.ipa
          if-no-files-found: error

  release:
    needs: [android, ios]
    if: ${{ always() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dl
          gh release create "test-build-${{ github.run_number }}" dl/* --title "Test build ${{ github.run_number }}" --prerelease --notes "Android: use successful-life-arm64.apk on almost every phone (arm32 file is only for much older phones). iOS: successful-life-ios-unsigned.ipa is unsigned and must be signed/sideloaded (for example with AltStore or Sideloadly) or built with an Apple developer account."
