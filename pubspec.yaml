name: successful_life
description: Private 90-day personal development companion.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  share_plus: ^10.0.2
  archive: ^3.6.1
  path_provider: ^2.1.4
  file_picker: ^8.1.2
flutter:
  uses-material-design: true
  assets:
    - assets/questions/ice_breakers.txt
    - assets/questions/confessions.txt
    - assets/questions/getting_deep.txt
    - assets/questions/challenge.txt
    - assets/exercises.json
    - assets/quotes.txt
    - assets/nudges.txt
